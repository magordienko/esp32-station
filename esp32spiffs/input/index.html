<!DOCTYPE html>
<html lang="en">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<title>ESP32 File Server</title>
	<script>
		var xhr;
		var idTimer1;
		function onload() {
			xhr = new (XMLHttpRequest);
			xhr.open("POST", "color.html?start=0", true);
			xhr.responseType = "text";
			xhr.onload = function (oEvent) {
				document.getElementById('info_table').innerHTML = xhr.response;
			}
			xhr.send(null);
			idTimer1 = setInterval("Timer1()", 100);
		}
		function Timer1() {
			xhr.open("POST", "color.html?start=0", true);
			xhr.responseType = "text";
			xhr.onload = function (oEvent) {
				document.getElementById('info_table').innerHTML = xhr.response;
			}
			xhr.send(null);
		}
		function red_on() {
			xhr.open("POST", "color.html?red=1", true);
			xhr.responseType = "text";
			xhr.onload = function (oEvent) {
				document.getElementById('info_table').innerHTML = xhr.response;
			}
			xhr.send(null);
		}
		function red_off() {
			xhr.open("POST", "color.html?red=0", true);
			xhr.responseType = "text";
			xhr.onload = function (oEvent) {
				document.getElementById('info_table').innerHTML = xhr.response;
			}
			xhr.send(null);
		}
	</script>
	<style>
		.button1 {
			width: 150px;
			height: 48px;
			font-size: 17px;
		}

		.button1:hover {
			border: 1px solid rgb(198, 198, 198);
		}

		.button1:active {
			background: linear-gradient(#f59500, #f5ae00) #f59500;
		}

		table {
			border: 1px solid grey;
		}
	</style>
</head>

<body onload="onload()">
	<font size="5">
		<div id="info_table"></div>
	</font>
	<br />
	<div>
		<input class="button1" style="color: #00ffff; background-color: #800000;" type="button" onclick="red_off()"
			value="RED OFF" />
		<input class="button1" style="color: #00ffff; background-color: #ff0000;" type="button" onclick="red_on()"
			value="RED ON" />
	</div>
	<br /><br />
</body>

</html>
